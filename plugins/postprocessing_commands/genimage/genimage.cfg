config {
    mkdosfs = "/sbin/mkdosfs"
    mke2fs = "/sbin/mke2fs"
    e2fsck = "/sbin/e2fsck"
}

image disk-image.img {
    hdimage {
        align = "1M"
        partition-table-type = "mbr"
        fill = "true"
    }

    partition boot {
        offset = "1M"
        partition-type = 0x0c
        image = "boot.fat32"
        bootable = "true"
    }

    partition data {
        partition-type = 0x83
        image = "data.ext4"
    }

    partition root {
        partition-type = 0x83
        image = "root.btrfs"
    }
}

image boot.fat32 {
    name = "boot"
    vfat {
        label = "boot"
    }
    size = "128M"
    mountpoint = "factory/boot/firmware"
}

image data.ext4 {
    name = "data"
    ext4 {
        label = "data"
        use-mke2fs = "true"
    }
    size = "256M"
    mountpoint = "factory/data"
}

image root.btrfs {
    name = "root"
    btrfs {
        label = "root"
        extraargs = "--subvol default-ro:factory"
    }
    size = "250%"
    mountpoint = "/"
}

