# ----------------------------------------------------------------------------
# multiboot configuration
{% if ebs_bootloader_type == "u-boot" %}
# tailored for u-boot bootloader
# ----------------------------------------------------------------------------
BOOTLOADER_TYPE="u-boot"

# Target location of the per partition boot script (boot.scr).
# This location has to match the setup in the primary boot.scr.
BOOTLOADER_DIRECTORY="/boot"
{% else %}
# tailored for Raspberry Pi bootloader
# ----------------------------------------------------------------------------
BOOTLOADER_TYPE="raspberry-pi"

set_bootloader_directory()
{
    local CURRENT_ROOT_DEVICE
    local CURRENT_ROOT_PARTITION_NUMBER

    if ischroot || test -e /usr/bin/systemd-detect-virt && systemd-detect-virt -q
    then
        BOOTLOADER_DIRECTORY="/boot/image-kernel"
    else
        CURRENT_ROOT_DEVICE=$(mount | sed -n 's|^/dev/\(.*\) on / .*|\1|p')
        if [ -z "${CURRENT_ROOT_DEVICE}" ]
        then
            BOOTLOADER_DIRECTORY="unknown_boot_device"
        fi

        CURRENT_ROOT_PARTITION_NUMBER=$(echo "${CURRENT_ROOT_DEVICE}" | grep -o '[1-9][0-9]*$')
        if [ -z "${CURRENT_ROOT_PARTITION_NUMBER}" ]
        then
            BOOTLOADER_DIRECTORY="unknown_boot_partition_number"
        fi

        BOOTLOADER_DIRECTORY="/boot/firmware/p${CURRENT_ROOT_PARTITION_NUMBER}"
    fi
}

set_bootloader_directory
{% endif %}

# This secondary boot script is on the same partition.
CHECK_MOUNT=false

# Use the multiboot template.
BOOT_COMMAND_TEMPLATE="/etc/edi-boot-shim/{{ ebs_template }}"
