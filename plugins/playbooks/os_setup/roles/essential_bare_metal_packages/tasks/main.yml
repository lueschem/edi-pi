---
- name: Add btrfs-progs to the list of bare metal packages.
  set_fact:
    bare_metal_packages: "{{ bare_metal_packages + ['btrfs-progs'] }}"
  when: rootfs_partition_type == "btrfs"

- name: Add dracut to the list of bare metal packages.
  set_fact:
    bare_metal_packages: "{{ bare_metal_packages + ['dracut'] }}"
  when: initramfs_tool == "dracut"

- name: Install dracut btrfs snapshot module.
  copy:
    src: "{{ item }}"
    dest: /usr/lib/dracut/modules.d/95rootfs-snapshot/
    mode: 0755
  loop:
    - module-setup.sh
    - snapshot-rootfs.sh
  when: initramfs_tool == "dracut"

- name: Enable reproducible initramfs builds.
  copy:
    src: "50-reproducible.conf"
    dest: /etc/dracut.conf.d/
    mode: 0644
  when: initramfs_tool == "dracut"

- name: Install packages that are essential for running on bare metal.
  apt:
    name: "{{ bare_metal_packages }}"
    state: present
    install_recommends: no

# Workaround: Install the kernel after dracut to make sure edi-boot-shim finds the initramfs image.
- name: Install kernel {{ kernel_image }} from repository.
  apt:
    name: "{{ kernel_image }}"
    state: present
    install_recommends: no
  when: not kernel_image.endswith(".deb")

- name: Copy local kernel {{ kernel_image }}.
  copy:
    src: "{{ kernel_image }}"
    dest: /tmp
  when: kernel_image.endswith(".deb")

- name: Install local kernel {{ kernel_image }}.
  apt:
    deb: "/tmp/{{ kernel_image }}"
  when: kernel_image.endswith(".deb")

- name: Install wpasupplicant on devices that have WiFi.
  apt:
    name: wpasupplicant
    state: present
    install_recommends: no
  when: mender_device_type != "pi2"

- name: Preset unused wpa_supplicant and systemd-networkd services to disabled.
  copy:
    src: "{{ item }}"
    dest: /lib/systemd/system-preset/
  loop:
    - 95-wpa_supplicant.preset
    - 85-systemd_networkd.preset

- name: Disable persistent logging to protect the eMMC/flash.
  file:
    path: /var/log/journal
    state: absent

- name: Configure journald storage to volatile to prevent logging also on btrfs.
  copy:
    src: 40-edi-volatile-storage.conf
    dest: /usr/lib/systemd/journald.conf.d/

- name: Disable DUMP_OBSS on brcmfmac.
  copy:
    src: brcmfmac.conf
    dest: /etc/modprobe.d/

- name: Create directory for edi-set-hostname customization.
  file:
    path: /etc/systemd/system/edi-set-hostname.service.d
    state: directory
    mode: 0755

- name: Customize edi-set-hostname service.
  template:
    src: edi-set-hostname.override.conf
    dest: /etc/systemd/system/edi-set-hostname.service.d/override.conf
    mode: 0644

- name: Add a script that deals with read only btrfs snapshot on first boot.
  ansible.builtin.copy:
    src: edi-btrfs-firstboot
    dest: /usr/bin/edi-btrfs-firstboot
    mode: '0755'
  when: rootfs_partition_type == "btrfs"

- name: Add a systemd service that handles the first boot on btrfs.
  ansible.builtin.copy:
    src: edi-btrfs-firstboot.service
    dest: /lib/systemd/system/
    mode: '0644'
  when: rootfs_partition_type == "btrfs"

- name: Create a directory that will receive the systemd symbolic link.
  ansible.builtin.file:
    path: /etc/systemd/system/sysinit.target.wants
    state: directory
    mode: '0755'
  when: rootfs_partition_type == "btrfs"

- name: Enable the systemd service that handles the first boot on btrfs.
  ansible.builtin.file:
    src: /lib/systemd/system/edi-btrfs-firstboot.service
    dest: /etc/systemd/system/sysinit.target.wants/edi-btrfs-firstboot.service
    state: link
  when: rootfs_partition_type == "btrfs"

