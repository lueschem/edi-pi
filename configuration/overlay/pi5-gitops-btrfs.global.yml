general:
    parameters:
        mender_device_type: pi5-v3
        ebs_bootloader_type: "raspberry-pi"
        edi_bootstrap_architecture: arm64
        qemu_emulated_cpu: cortex-a57
        initramfs_tool: dracut
        rootfs_partition_type: btrfs

playbooks:
    100_os_setup:
        parameters:
            ebs_template: boot.spec.rpi5.${DEBIAN_ARCHITECTURE}
            ebs_bootloader_directory: "/boot/image-kernel"
            kernel_image: linux-image-6.12.47-v8-16k+
            enable_gitops: True
