general:
    parameters:
        mender_device_type: pi4-v3
        ebs_bootloader_type: "raspberry-pi"
        edi_bootstrap_architecture: arm64
        qemu_emulated_cpu: cortex-a57
        initramfs_tool: dracut
        rootfs_partition_type: btrfs

playbooks:
    100_os_setup:
        parameters:
            ebs_template: boot.spec.rpi4.${DEBIAN_ARCHITECTURE}
            kernel_image: linux-image-6.18.50-v8+
            enable_gitops: True
